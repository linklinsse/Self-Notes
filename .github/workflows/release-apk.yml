# Release pipeline: builds a signed APK whose version is the content of /VERSION,
# tags the commit v<VERSION> and publishes a GitHub Release with the APK attached.
#
# Triggers:
#   - push to main that changes VERSION  -> automatic release
#   - manual run (Actions tab)           -> release the current VERSION
# A version is released only once: if tag v<VERSION> already exists the run is a no-op.
# Required secrets and keystore setup: see docs/release.md.
name: Release APK

on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-apk
  cancel-in-progress: false

env:
  NODE_VERSION: "24"
  JAVA_VERSION: "21"

jobs:
  prepare:
    name: Read VERSION
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      release: ${{ steps.check.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read and validate VERSION
        id: version
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error file=VERSION::VERSION must be MAJOR.MINOR.PATCH (got '$version')"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Decide whether to release
        id: check
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::notice::$TAG already exists, nothing to release. Bump VERSION to publish a new APK."
            echo "release=false" >> "$GITHUB_OUTPUT"
          elif [ ! -f frontend/package.json ] || [ ! -d frontend/android ]; then
            echo "::warning::frontend/android does not exist yet, skipping APK release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  build-apk:
    name: Build, sign and publish APK
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ needs.prepare.outputs.tag }}
      APK_NAME: Self-Notes-${{ needs.prepare.outputs.tag }}.apk
    steps:
      - uses: actions/checkout@v4

      - name: Check signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret $name (see docs/release.md)"
              missing=1
            fi
          done
          exit "$missing"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Build web bundle and sync Capacitor
        working-directory: frontend
        env:
          # Optional repository variable: server pre-filled on the APK login screen.
          VITE_DEFAULT_SERVER_URL: ${{ vars.DEFAULT_SERVER_URL }}
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Assemble unsigned release APK
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Align, sign and verify APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          unsigned="frontend/android/app/build/outputs/apk/release/app-release-unsigned.apk"
          keystore="$RUNNER_TEMP/release.jks"
          mkdir -p dist

          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          "$build_tools/zipalign" -p -f 4 "$unsigned" "$RUNNER_TEMP/aligned.apk"
          "$build_tools/apksigner" sign \
            --ks "$keystore" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out "dist/$APK_NAME" \
            "$RUNNER_TEMP/aligned.apk"
          rm -f "$keystore"

          "$build_tools/apksigner" verify --print-certs "dist/$APK_NAME"

          # The APK must carry the VERSION file's value (android/app/build.gradle reads it).
          apk_version="$("$build_tools/aapt2" dump badging "dist/$APK_NAME" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")"
          if [ "$apk_version" != "$VERSION" ]; then
            echo "::error::APK versionName is '$apk_version' but VERSION is '$VERSION' (see docs/release.md)"
            exit 1
          fi

          (cd dist && sha256sum "$APK_NAME" > "$APK_NAME.sha256")

      - name: Extract release notes from CHANGELOG.md
        run: |
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s "$RUNNER_TEMP/notes.md" ]; then
            notes=(--notes-file "$RUNNER_TEMP/notes.md")
          else
            notes=(--generate-notes)
          fi
          gh release create "$TAG" dist/* \
            --target "$GITHUB_SHA" \
            --title "Self-Notes $TAG" \
            "${notes[@]}"
