<!doctype html>
<!--
  Shown by Capacitor (server.errorPath in capacitor.config.ts) when the phone's Android System
  WebView is older than android.minWebViewVersion, or when the app itself fails to load.
  System colors only: no theme is available here.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>Self-Notes</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
        font-family: system-ui, sans-serif;
        line-height: 1.5;
        background: Canvas;
        color: CanvasText;
      }
      main {
        max-width: 28rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Self-Notes can't start</h1>
      <p>
        This app needs a recent version of <strong>Android System WebView</strong>. Update it from the Play Store
        (or update Google Chrome), then open Self-Notes again.
      </p>
    </main>
  </body>
</html>
