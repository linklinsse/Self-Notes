# Self-Notes — full stack: API (SQLite database in ./db) + web front (nginx).
# Usage:  cp .env.example .env  (edit secrets)  &&  docker compose up -d --build
# Needs Docker Compose v2 ("docker compose"); the old "docker-compose" 1.x cannot read this file.
# The "web" service serves the front and proxies /api to "backend".

name: self-notes

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: self-notes-backend:local
    restart: unless-stopped
    volumes:
      # The database: <DB_DIR>/prod.db, with prod.db-wal and prod.db-shm while the API runs.
      # Back up this folder (docs/deployment.md).
      - ${DB_DIR:-./db}:/app/db
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: file:/app/db/prod.db
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-30d}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:9292}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://localhost,http://localhost}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      SHARE_LINK_MAX_FAILURES: ${SHARE_LINK_MAX_FAILURES:-10}
      SHARE_LINK_BLOCK: ${SHARE_LINK_BLOCK:-15m}
      # Keep it on in production. The end-to-end tests turn it off (they create many accounts).
      RATE_LIMIT: ${RATE_LIMIT:-true}
    ports:
      # The app reaches the API through "web" (/api). This port is for a proxy or tools on the
      # host: loopback only by default. A client that reaches the backend without a proxy could
      # fake its IP (X-Forwarded-For) and escape rate limits; see docs/deployment.md.
      - "${API_PORT:-127.0.0.1:9191}:3000"
    healthcheck:
      # 127.0.0.1, not localhost: on Alpine "localhost" resolves to ::1 first.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: self-notes-web:local
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${APP_PORT:-9292}:80"
