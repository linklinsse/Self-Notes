# Self-Notes — full stack: PostgreSQL + API + web front (nginx).
# Usage:  cp .env.example .env  (edit secrets)  &&  docker compose up -d --build
# Only the "web" service is published; it serves the front and proxies /api to "backend".

name: self-notes

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-selfnotes}
      POSTGRES_USER: ${POSTGRES_USER:-selfnotes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: self-notes-backend:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-selfnotes}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-selfnotes}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-30d}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:9292}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://localhost,http://localhost}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      SHARE_LINK_MAX_FAILURES: ${SHARE_LINK_MAX_FAILURES:-10}
      SHARE_LINK_BLOCK: ${SHARE_LINK_BLOCK:-15m}
    ports:
      # The app reaches the API through "web" (/api). This port is for a proxy or tools on the
      # host: loopback only by default. A client that reaches the backend without a proxy could
      # fake its IP (X-Forwarded-For) and escape rate limits; see docs/deployment.md.
      - "${API_PORT:-127.0.0.1:9191}:3000"
    healthcheck:
      # 127.0.0.1, not localhost: on Alpine "localhost" resolves to ::1 first.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: self-notes-web:local
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${APP_PORT:-9292}:80"

volumes:
  db-data:
